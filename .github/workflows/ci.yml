name: CI

on:
  pull_request:
  push:
    branches: [main]

# Tier-1 CI: device-free checks that run on every PR. The real on-device
# correctness/perf suite runs on a self-hosted runner (see TESTING.md), not here
# — GitHub-hosted runners have no Adreno GPU.

jobs:
  # ── Static invariants on the per-model build/deploy/run scripts ──────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint model scripts
        run: bash scripts/ci/lint_scripts.sh

  # ── Cross-compile every model for Android arm64 (compile/link only) ──────
  build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model:
          - bonsai
          - bonsai-27b
          - depth-anything-v2-small
          - functiongemma-270m-it
          - granite-4-0-350m
          - kokoro-82m
          - lfm2-5-350m
          - lfm2-5-vl-450m
          - mamba-130m
          - mamba2-130m
          - mms-tts
          - moonshine-tiny
          - musicgen-small
          - openelm-270m
          - openvoice-v2
          - pocket-tts
          - qwen2-5-0-5b
          - seamless-m4t-unity-small
          - smollm2-135m-instruct
          - smolvlm-256m-instruct
          - stable-audio-open-small
          - whisper-tiny
    steps:
      - uses: actions/checkout@v4

      - name: Cache OpenCL deps (headers + ICD-loader stub)
        uses: actions/cache@v4
        with:
          path: ~/.cache/adreno-llms/opencl
          key: opencl-deps-v2024.10.24

      - name: Set up OpenCL deps (device-free)
        run: ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" bash scripts/ci/setup_opencl_stub.sh

      - name: Build ${{ matrix.model }} (fp16 release)
        run: |
          cd "src/models/${{ matrix.model }}"
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" ./scripts/build.sh --release

      # Where the binary lands depends on the dtype the port ships. The Bonsai ports
      # are 1-bit and ship fp32 (build/<name>_inference); everything else ships fp16
      # (build/fp16/<name>_inference_fp16). Resolved ONCE here — it used to be an
      # inline if/else repeated in all four checks below, so adding a port meant
      # editing the same condition four times and any miss failed as "no binary".
      - name: Locate the built binary
        run: |
          m="${{ matrix.model }}"
          case "$m" in
            bonsai|bonsai-27b)
              bin=$(find "src/models/$m/build" -maxdepth 1 -type f -name '*_inference' | head -1) ;;
            *)
              bin=$(find "src/models/$m/build/fp16" -maxdepth 1 -type f -name '*_inference_fp16' | head -1) ;;
          esac
          test -n "$bin" || { echo "no binary produced for $m"; exit 1; }
          echo "BIN=$bin" >> "$GITHUB_ENV"

      - name: Verify a binary was produced
        run: |
          file "$BIN" | grep -q 'ARM aarch64' || { echo "binary is not arm64"; file "$BIN"; exit 1; }
          echo "OK: $BIN"

      # Catches the "runs via adb, CANNOT LINK in-app" class: a binary that needs a
      # shared lib the host app's jniLibs don't ship (libclblast.so / libc++_shared.so)
      # or undefined libc++ symbols. App-embedded models (openvoice-v2) must be fully
      # self-contained (--strict: static CLBlast + static libc++); the rest must at
      # least not pull in libc++_shared.so or surprise deps.
      - name: Check binary is app-linkable
        run: |
          strict=""; [ "${{ matrix.model }}" = "openvoice-v2" ] && strict="--strict"
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" bash scripts/ci/check_self_contained.sh "$BIN" $strict

      # Google Play (Android 15 / API 35+) REJECTS an AAB whose bundled .so isn't 16 KB
      # (0x4000)-page aligned, and it fails to load on 16 KB-page devices. NDK r26d defaults
      # to 4 KB — each model must link with -Wl,-z,max-page-size=16384. This gate proves it
      # here, in the model repo, before the binary is embedded in the app (device-free ELF
      # parse; mirrors Edgi's verifyNativeLibAlignment so they can't drift).
      - name: Check binary is 16 KB-page aligned (Google Play)
        run: |
          bash scripts/ci/check_16kb_alignment.sh "$BIN"

      # CLBlast must be linked DYNAMICALLY (one shared libclblast.so shipped for the
      # whole app), never statically baked into each binary — static duplicates ~3 MB
      # per model. This gate fails a regression back to static (exempts openvoice-v2's
      # intentional self-contained build and models that use no CLBlast at all).
      - name: Check CLBlast is dynamically linked
        run: |
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" bash scripts/ci/check_clblast_dynamic.sh "$BIN" "${{ matrix.model }}"
